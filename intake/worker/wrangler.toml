# Cloudflare Worker da Descrevi (plano gratuito).
# https://descrevi-intake.heliovcastro.workers.dev
# Site: https://heliovc.github.io/descrevi/
name = "descrevi-intake"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "descrevi"
database_id = "cc451b92-c901-4006-b4bf-859d49387f6a"

# Lembrete de formulário pendente e limpeza de 30 dias. 12:00 UTC = 09:00 em America/Sao_Paulo.
[triggers]
crons = ["0 12 * * *"]

[vars]
SITE_URL = "https://heliovc.github.io/descrevi"
INTAKE_URL = "https://descrevi-intake.heliovcastro.workers.dev"
ORIGENS_PERMITIDAS = "https://heliovc.github.io"
SENDER_EMAIL = "fornecia.alertas@gmail.com"
REPLY_TO = "contato@valorasolucoes.com"
SUPORTE_EMAIL = "contato@valorasolucoes.com"
ENDERECO_REMETENTE = "FIT TECNOLOGIA E SERVICOS ADMINISTRATIVOS LTDA · CNPJ 49.408.467/0001-64 · Rua Visconde de Pirajá, 414, sala 718, Ipanema, Rio de Janeiro/RJ, CEP 22410-002"
SENDER_NAME = "Descrevi"
DRY_RUN = "false"
# Um produto com duas ofertas. Ids de oferta não aparecem no painel da Kiwify;
# o Worker identifica o pacote pelo valor (4700/12700) ou pelo nome da oferta.
KIWIFY_PRODUTO = "1e58c4e0-e1aa-11f1-9a10-b55ed40f87a6"
KIWIFY_OFERTA_3 = ""
KIWIFY_OFERTA_10 = ""
KIWIFY_CHECKOUT_3 = "v8kNLZF"
KIWIFY_CHECKOUT_10 = "OkuKaeG"
KIWIFY_VALOR_3 = "4700"
KIWIFY_VALOR_10 = "12700"
GITHUB_REPO = "heliovc/descrevi"
TITULO_TETO = "80"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Segredos (wrangler secret put …; localmente em .dev.vars, que não entra no git):
# KIWIFY_TOKEN, EXPORT_TOKEN, LINK_SECRET, BREVO_API_KEY, TURNSTILE_SECRET, GEMINI_API_KEY, GITHUB_DISPATCH_TOKEN
