# Publica o site estático (pasta site/) no GitHub Pages.
# Só roda quando alguém dispara manualmente, depois da revisão do Chefe e da aprovação do dono.
# Não está ligado a push. Não execute até haver autorização.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
